[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "supplychain-radar"
version = "1.0.0"
description = "Offline-first software supply chain security workbench: dependency paths, OSV advisories, remediation simulation, scan diffs and policy gates."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SupplyChain Radar contributors" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "packaging>=24.0",
  "jsonschema>=4.21",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
supplychain-radar = "scradar.cli.main:app"
scradar = "scradar.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/scradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "S603", "S607", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
