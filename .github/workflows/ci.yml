name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]" types-jsonschema
      - run: ruff check backend
      - run: ruff format --check backend
      - run: mypy backend/src
      - run: pytest backend/tests -p no:cacheprovider
      - name: Build wheel
        run: pip install build && python -m build --wheel --outdir dist backend

  security-regression:
    # Deliberately-affected fixtures must be detected, negative controls must stay clean,
    # exports must validate against the official SARIF / CycloneDX schemas, adversarial inputs must be rejected.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - run: >
          pytest backend/tests -p no:cacheprovider
          -k "recorded_expected or negative_control or sarif or cyclonedx or zip or yaml_alias or sockets or never_executed or escape"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  e2e:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - run: pip install -e backend
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: npx playwright test
        working-directory: tests/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: tests/e2e/test-results
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose up --build -d --wait --wait-timeout 180
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/smoke.py http://127.0.0.1:8000
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
        if: always()
