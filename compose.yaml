# One-command local stack:  docker compose up --build -d   ->  http://127.0.0.1:8000
# The port is published on loopback only. Do not change this to 0.0.0.0 without setting SCRADAR_API_TOKEN
# and putting the service behind TLS and authentication you control.
name: supplychain-radar
services:
  app:
    build: .
    image: supplychain-radar:1.0.0
    ports:
      - "127.0.0.1:${SCRADAR_PORT:-8000}:8000"
    environment:
      SCRADAR_API_TOKEN: "${SCRADAR_API_TOKEN:-}"
      SCRADAR_OSV_URL: "${SCRADAR_OSV_URL:-https://api.osv.dev}"
    volumes:
      - scradar-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 10s
volumes:
  scradar-data:
